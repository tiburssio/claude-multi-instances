# Instâncias isoladas. Um serviço:nome por linha.
# Edite este arquivo e rode de novo o setup, ou use ./setup → Configurar → Criar conta nova.
#
# Formato:
#   serviço:nome
#   serviço:nome|Título no Raycast|emoji
#
# Serviços: claude, cursor, codex
# O nome vira a pasta de dados e o atalho "Claude (nome)" / "Cursor (nome)" / "Codex (nome)".
# Codex: ~/.codex-instances/<nome> vira CODEX_HOME (CLI no Terminal).

claude:personal
claude:work
cursor:personal
cursor:work
codex:personal
codex:work
